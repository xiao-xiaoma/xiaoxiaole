function parseWordsFromText(text, groupName){
    var lines = text.split("\n");
    var arr = [];
    lines.forEach(function(line){
        line = line.trim();
        if(!line) return;
        var parts = line.split(/[；;]/);
        if(parts.length >= 3){
            var en = parts[0].trim();
            var phon = parts[1].trim();
            var zh = parts.slice(2).join("，").trim();
            if(en && zh){
                arr.push({en:en, phon:phon, zh:zh, group:groupName, level:0, nextReview:0});
            }
        }
    });
    return arr;
}
function parseSentencesFromText(text, groupName){
    var lines = text.split("\n");
    var arr = [];
    lines.forEach(function(line){
        line = line.trim();
        if(!line) return;
        var idx = line.indexOf("+");
        if(idx < 0) return;
        var en = line.slice(0, idx).trim();
        var zh = line.slice(idx + 1).trim();
        if(en && zh){
            arr.push({en:en, zh:zh, group:groupName, level:0, nextReview:0});
        }
    });
    return arr;
}
function parsePhrasesFromText(text, groupName){
    var lines = text.split("\n");
    var arr = [];
    lines.forEach(function(line){
        line = line.trim();
        if(!line) return;
        var idx = line.indexOf("+");
        if(idx < 0) return;
        var en = line.slice(0, idx).trim();
        var zh = line.slice(idx + 1).trim();
        if(en && zh){
            arr.push({en:en, phon:"", zh:zh, group:groupName, level:0, nextReview:0});
        }
    });
    return arr;
}

/* ============================================================
 * IndexedDB 封装
 * ============================================================ */
var idbRef = null;
var idbReady = false;
function openIdb(){
    return new Promise(function(resolve){
        try{
            if(!window.indexedDB){ resolve(false); return; }
            var req = indexedDB.open("xxm_game_db", 1);
            req.onupgradeneeded = function(e){
                var db = e.target.result;
                if(!db.objectStoreNames.contains("kv")){
                    db.createObjectStore("kv");
                }
            };
            req.onsuccess = function(e){
                idbRef = e.target.result;
                idbReady = true;
                resolve(true);
            };
            req.onerror = function(){ resolve(false); };
            req.onblocked = function(){ resolve(false); };
        }catch(e){ resolve(false); }
    });
}
function idbGet(key){
    return new Promise(function(resolve){
        if(!idbReady){ resolve(null); return; }
        try{
            var tx = idbRef.transaction("kv", "readonly");
            var st = tx.objectStore("kv");
            var req = st.get(key);
            req.onsuccess = function(){ resolve(req.result === undefined ? null : req.result); };
            req.onerror = function(){ resolve(null); };
        }catch(e){ resolve(null); }
    });
}
function idbSet(key, val){
    return new Promise(function(resolve, reject){
        if(!idbReady){ reject(new Error("idb unavailable")); return; }
        try{
            var tx = idbRef.transaction("kv", "readwrite");
            var st = tx.objectStore("kv");
            var req = st.put(val, key);
            req.onsuccess = function(){ resolve(true); };
            req.onerror = function(e){ reject(e); };
        }catch(e){ reject(e); }
    });
}

    });

    /* ---- 自动补全：高中例句 ---- */
    var hasHighSchool = false;
    for(var i = 0; i < sentenceDb.length; i++){
        if((sentenceDb[i].group || "") === "高中例句"){ hasHighSchool = true; break; }
    }
    if(!hasHighSchool){
        var hsArr = parseSentencesFromText(HIGH_SCHOOL_SENTENCES_TEXT, "高中例句");
        var existEn2 = {};
        for(var i = 0; i < sentenceDb.length; i++){
            if((sentenceDb[i].group || "") === "高中例句") existEn2[sentenceDb[i].en] = true;
        }
        for(var j = 0; j < hsArr.length; j++){
            if(!existEn2[hsArr[j].en]) sentenceDb.push(hsArr[j]);
        }
    }

    saveWords();
    saveSentences();

    wordDb.forEach(function(x){ if(typeof x.level !== "number") x.level = 0; if(typeof x.nextReview !== "number") x.nextReview = 0; if(!x.group) x.group = "核心词汇"; });

}

function renderReview(){
    var cardsEl = $("reviewCards");
    if(!cardsEl) return;
    var navPrev = $("reviewPrevBtn");
    var navNext = $("reviewNextBtn");
    var navInfo = $("reviewPageInfo");

    /* 读取当前分组页码 */
    reviewPage = getReviewPage();

    var now=Date.now();
    var gw=getGroupWords(), gs=getGroupSentences();

    if(reviewTab==="word" && gw.length===0 && gs.length>0) reviewTab="sentence";
    else if(reviewTab==="sentence" && gs.length===0 && gw.length>0) reviewTab="word";

    var sourceList = reviewTab==="word" ? gw : gs;
    sourceList = sourceList.filter(function(x){return x.level<8 && now>=x.nextReview;});
    sourceList.sort(function(a,b){
        var ae=errorWordSet[a.en]?1:0, be=errorWordSet[b.en]?1:0;
        return be-ae;
    });

    var total=sourceList.length;
    var emptyText = reviewTab==="word" ? "当前分组暂无到期复习单词" : "当前分组暂无到期复习句子";

        if(navPrev) navPrev.disabled = true;
        if(navNext) navNext.disabled = true;
        if(navInfo) navInfo.textContent = "0 / 0";
        return;
    }

    var pages=Math.ceil(total/REVIEW_PAGE_SIZE);
    if(reviewPage>pages-1)reviewPage=pages-1;
    if(reviewPage<0)reviewPage=0;
    setReviewPage(reviewPage);  /* 保存修正后的页码 */

    var pageData=sourceList.slice(reviewPage*REVIEW_PAGE_SIZE,(reviewPage+1)*REVIEW_PAGE_SIZE);

    var html="";
    pageData.forEach(function(item){

        if(reviewTab==="word"){
            var phon=item.phon?'<span class="rev-phonetic">'+escapeHtml(item.phon)+'</span>':"";
            html+='<div class="review-card '+(isErr?"error-word":"")+'">'+
                '<div class="rev-content">'+
                    '<div class="rev-word-line">'+
                        '<span class="rev-word" data-word="'+escapeHtml(item.en)+'">'+escapeHtml(item.en)+'</span>'+phon+
                    '</div>'+
                    '<div class="rev-zh">'+escapeHtml(item.zh)+'</div>'+
                '</div>'+
                '<div class="rev-buttons">'+
                    '<button class="btn btn-success" data-action="w-right" data-en="'+escapeHtml(item.en)+'">✅ 记得</button>'+
                    '<button class="btn btn-danger" data-action="w-wrong" data-en="'+escapeHtml(item.en)+'">❌ 忘记</button>'+
                '</div>'+
            '</div>';
        }else{
            html+='<div class="review-card '+(isErr?"error-word":"")+'">'+
                '<div class="rev-content">'+
                    '<div class="rev-sentence-en" data-word="'+escapeHtml(item.en)+'">'+escapeHtml(item.en)+'</div>'+
                    '<div class="rev-sentence-zh">'+escapeHtml(item.zh)+'</div>'+
                '</div>'+
                '<div class="rev-buttons">'+
                    '<button class="btn btn-success" data-action="s-right" data-en="'+escapeHtml(item.en)+'">✅ 记得</button>'+
                    '<button class="btn btn-danger" data-action="s-wrong" data-en="'+escapeHtml(item.en)+'">❌ 忘记</button>'+
                '</div>'+
            '</div>';
        }
    });
    cardsEl.innerHTML = html;

    if(navPrev) navPrev.disabled = (reviewPage <= 0);
    if(navNext) navNext.disabled = (reviewPage >= pages-1);
    if(navInfo) navInfo.textContent = (reviewPage + 1) + " / " + pages;

    bindReviewEvents();
    cardsEl.querySelectorAll("[data-word]").forEach(function(d){bindLongPress(d,d.dataset.word);});

/* ============ 苹果风格页面切换动画（水平滑动·慢速版） ============ */
function getTranslateX(el){
    try{
        var t = getComputedStyle(el).transform;
        if(!t || t === "none") return 0;
        if(t.indexOf("matrix3d") === 0){
            var v3 = t.slice(9, -1).split(",");
            return parseFloat(v3[12]) || 0;
        }
        if(t.indexOf("matrix") === 0){
            var v2 = t.slice(7, -1).split(",");
            return parseFloat(v2[4]) || 0;
        }
    }catch(e){}
    return 0;
}

function animatePageSwitch(direction, callback){
    var stage = $("reviewStage");
    if(!stage){ callback(); return; }
    if(stage.dataset.animating === "1") return;
    stage.dataset.animating = "1";

    var W = stage.clientWidth || window.innerWidth || 320;
    var outX = direction > 0 ? -W : W;   /* 下一页：向左滑出；上一页：向右滑出 */

    /* 滑出（放慢：0.26s → 0.42s） */
    stage.style.transition = "transform .42s cubic-bezier(.25,.8,.25,1)";
    stage.style.transform = "translateX(" + outX + "px)";

    setTimeout(function(){
        callback();  /* 渲染新一页 */

        /* 瞬移到反方向起点（不可见） */
        var inX = direction > 0 ? W : -W;
        stage.style.transition = "none";
        stage.style.transform = "translateX(" + inX + "px)";

        void stage.offsetWidth;  /* 强制重排 */

        /* 滑入（放慢：0.3s → 0.46s） */
        stage.style.transition = "transform .46s cubic-bezier(.25,.8,.25,1)";
        stage.style.transform = "translateX(0)";

        setTimeout(function(){ stage.dataset.animating = "0"; }, 480);
    }, 430);
}

function bindReviewEvents(){
    var wrap = $("reviewView");
    if(!wrap) return;
    wrap.onclick = function(e){
        var btn = e.target.closest("button[data-action]");
        if(btn){
            var act = btn.dataset.action;
            if(act==="w-right"){ wordRight(btn.dataset.en); renderReview(); }
            else if(act==="w-wrong"){ wordWrong(btn.dataset.en); renderReview(); }
            else if(act==="s-right"){ sentenceRight(btn.dataset.en); renderReview(); }
            else if(act==="s-wrong"){ sentenceWrong(btn.dataset.en); renderReview(); }
            else if(act==="prev"){
                if(reviewPage > 0){
                    animatePageSwitch(-1, function(){
                        reviewPage--;
                        setReviewPage(reviewPage);
                        renderReview();
                    });
                }
            }
            else if(act==="next"){
                animatePageSwitch(1, function(){
                    reviewPage++;
                    setReviewPage(reviewPage);
                    renderReview();
                });
            }
        }
    };
}

/* ============ 苹果风格跟手滑动翻页（慢速版） ============ */
function bindReviewSwipe(){
    var wrap  = $("reviewView");
    var stage = $("reviewStage");
    if(!wrap || !stage) return;

    var startX = 0, startY = 0, startTime = 0, baseX = 0;
    var dragging = false, axisLock = null;   /* axisLock: null / "x" / "y" */

    function getPages(){
        var now = Date.now();
        var list = (reviewTab === "word" ? getGroupWords() : getGroupSentences())
            .filter(function(it){ return it.level < 8 && now >= it.nextReview; });
        return Math.ceil(list.length / REVIEW_PAGE_SIZE) || 1;
    }

    /* --- 开始触摸 --- */
    wrap.addEventListener("touchstart", function(e){
        if(e.touches.length !== 1) return;
        if(stage.dataset.animating === "1") return;

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startTime = Date.now();
        dragging = false;
        axisLock = null;

        /* 若正在回弹，立即停住并取当前位置，实现无跳变接续拖动 */
        baseX = getTranslateX(stage);
        stage.style.transition = "none";
        stage.style.transform = "translateX(" + baseX + "px)";
    }, {passive:true});

    /* --- 拖动 --- */
    wrap.addEventListener("touchmove", function(e){
        if(e.touches.length !== 1) return;
        if(stage.dataset.animating === "1") return;

        var x = e.touches[0].clientX;
        var y = e.touches[0].clientY;
        var dx = x - startX;
        var dy = y - startY;

        /* 首次超过 8px 时判断主轴方向 */
        if(axisLock === null){
            if(Math.abs(dx) > 8 || Math.abs(dy) > 8){
                axisLock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
            } else {
                return;
            }
        }
        /* 纵向滑动：交给默认滚动 */
        if(axisLock !== "x") return;

        /* 横向滑动：阻止纵向滚动 */
        if(e.cancelable) e.preventDefault();
        dragging = true;

        var W = wrap.clientWidth || 320;
        var pages = getPages();
        var real = baseX + dx;

        /* 边界阻尼（第一页继续右滑 / 最后一页继续左滑时） */
        if((reviewPage <= 0 && real > 0) || (reviewPage >= pages - 1 && real < 0)){
            real = real * 0.35;
        } else {
            /* 轻微阻尼，手感更"肉" */
            real = real * 0.92;
        }

        stage.style.transition = "none";
        stage.style.transform = "translateX(" + real + "px)";
    }, {passive:false});

    /* --- 松手 --- */
    wrap.addEventListener("touchend", function(e){
        if(!dragging){
            axisLock = null;
            /* 若触摸中断了回弹，则恢复回弹（放慢至 0.42s） */
            if(Math.abs(baseX) > 0.5){
                stage.style.transition = "transform .42s cubic-bezier(.25,.8,.25,1)";
                stage.style.transform = "translateX(0)";
            }
            return;
        }
        dragging = false;
        axisLock = null;

        var currentX = getTranslateX(stage);
        var dt = Math.max(1, Date.now() - startTime);
        var v = currentX / dt;   /* px/ms，负值=向左滑 */
        var W = wrap.clientWidth || 320;
        var pages = getPages();

        var canNext = reviewPage < pages - 1;
        var canPrev = reviewPage > 0;

        var distThreshold = W * 0.25;   /* 位移超过 1/4 宽 判定翻页 */
        var vThreshold = 0.75;          /* 速度阈值：0.5 → 0.75，需要更明确的滑势才翻页 */

        if(currentX < 0 && canNext && (Math.abs(currentX) > distThreshold || v < -vThreshold)){
            /* 下一页 */
            animatePageSwitch(1, function(){
                reviewPage++;
                setReviewPage(reviewPage);
                renderReview();
            });
        } else if(currentX > 0 && canPrev && (Math.abs(currentX) > distThreshold || v > vThreshold)){
            /* 上一页 */
            animatePageSwitch(-1, function(){
                reviewPage--;
                setReviewPage(reviewPage);
                renderReview();
            });
        } else {
            /* 回弹（放慢至 0.42s） */
            stage.style.transition = "transform .42s cubic-bezier(.25,.8,.25,1)";
            stage.style.transform = "translateX(0)";
        }
    }, {passive:true});

    /* --- 触摸取消 --- */
    wrap.addEventListener("touchcancel", function(){
        dragging = false;
        axisLock = null;
        stage.style.transition = "transform .42s cubic-bezier(.25,.8,.25,1)";
        stage.style.transform = "translateX(0)";
    }, {passive:true});
}

function shuffle(a){var t=a.slice();for(var i=t.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=t[i];t[i]=t[j];t[j]=x;}return t;}
function calcEnFontSize(t){var l=t.length;if(l<=10)return 16;return Math.max(13,16-(l-10)*0.4);}

function buildGame(){
    var grid=$("gameGrid");
    grid.innerHTML=""; game.flipped=[]; game.locked=false;
    var list=getGroupWords();
    if(list.length<NORMAL_PAIRS){grid.innerHTML='<div class="empty-state"><div class="emoji">📖</div><p>至少需要'+NORMAL_PAIRS+'个单词</p></div>';return;}
    var pick=shuffle(list).slice(0,NORMAL_PAIRS);
    var en=shuffle(pick.map(function(w){return{text:w.en,type:"en",key:w.en};}));
    var zh=shuffle(pick.map(function(w){return{text:w.zh,type:"zh",key:w.en};}));
    en.concat(zh).forEach(function(c){
        var d=document.createElement("div");
        d.className="card"; d.textContent=c.text;
        d.dataset.key=c.key; d.dataset.type=c.type;
        if(c.type==="en")d.style.fontSize=calcEnFontSize(c.text)+"px";
        d.onclick=function(){if(c.type==="en")speakWord(c.text);flipCard(d,"word");};
        grid.appendChild(d);
    });
}
function buildSentenceGame(){
    var grid=$("gameGrid");
    grid.innerHTML=""; game.flipped=[]; game.locked=false;
    var list=getGroupSentences();
    if(list.length<SENTENCE_PAIRS){grid.innerHTML='<div class="empty-state"><div class="emoji">📝</div><p>至少需要'+SENTENCE_PAIRS+'条句子</p></div>';return;}
    var pick=shuffle(list).slice(0,SENTENCE_PAIRS);
    var en=shuffle(pick.map(function(s){return{text:s.en,type:"sen-en",key:s.en};}));
    var zh=shuffle(pick.map(function(s){return{text:s.zh,type:"sen-zh",key:s.en};}));
    en.concat(zh).forEach(function(c){
        var d=document.createElement("div");
        d.className="card"; d.textContent=c.text;
        d.dataset.key=c.key; d.dataset.type=c.type;
        d.onclick=function(){if(c.type==="sen-en")speakWord(c.text);flipCard(d,"sentence");};
        grid.appendChild(d);
    });
}
function flipCard(el,type){
    if(game.locked)return;
    if(el.classList.contains("flipped"))return;
    el.classList.add("flipped");
    game.flipped.push(el);
    if(game.flipped.length===2){
        game.locked=true;
        var a=game.flipped[0],b=game.flipped[1];
        var match=a.dataset.key===b.dataset.key;
        if(match){
            playMatchSound();
            a.classList.add("matched");b.classList.add("matched");
            spawnStar(a);spawnStar(b);
            if(type==="word")wordRight(a.dataset.key);else sentenceRight(a.dataset.key);
            setTimeout(function(){
                a.classList.add("hidden");b.classList.add("hidden");
                game.flipped=[];game.locked=false;
                var remain=document.querySelectorAll("#gameGrid .card:not(.hidden)");
                if(remain.length===0){
                    var curLv = getCurrentLevel();
                    if(curLv < calcTotalLevel()){
                        setCurrentLevel(curLv + 1);
                    }
                    setTimeout(function(){if(appMode==="sentence")buildSentenceGame();else buildGame();},700);
                }
            },400);
        }else{
            a.classList.add("fail");b.classList.add("fail");
            setTimeout(function(){
                a.classList.remove("flipped","fail");b.classList.remove("flipped","fail");
                game.flipped=[];game.locked=false;
            },450);
        }
    }
}

/* ============================================================
 * 按钮绑定
 * ============================================================ */
function bindButtons(){
    $("currentModeBtn").onclick=function(){modeIndex=(modeIndex+1)%MODE_ORDER.length;switchMode(MODE_ORDER[modeIndex]);};
    $("restartBtn").onclick=function(){
        setReviewPage(0);
        reviewPage = 0;
        switchMode(appMode);
    };
    $("manageBtn").onclick=function(){$("managePanel").classList.toggle("active");};
    $("groupSelect").onchange=function(){
        game.flipped=[]; game.locked=false;
        updateDueCount(); updateLevelUi();
        switchMode(appMode);
    };

    $("importBtn").onclick = async function(){
        var text = $("wordInput").value.trim();
        var gname = $("groupNameInput").value.trim() || "默认";
        if(!text){ showToast("请先粘贴内容", "warn"); return; }

        var lines = text.split("\n");
        var total = lines.length;
        var cnt = 0, skipped = 0;
        var sampleSkip = "";

        var btn = $("importBtn");
        btn.disabled = true;
        var oldLabel = btn.textContent;
        btn.textContent = "⏳ 0/" + total;

        for(var i = 0; i < lines.length; i++){
            var line = lines[i].trim();
            if(!line) continue;

            if(line.indexOf("+") >= 0){
                var parts = line.split("+");
                var en = parts[0].trim();
                var zh = parts.slice(1).join("+").trim();
                if(en && zh){
                    sentenceDb.push({en:en, zh:zh, group:gname, level:0, nextReview:0});
                    cnt++;
                } else { skipped++; if(!sampleSkip) sampleSkip = line; }
            } else {
                var segs = line.split(/[；;]/);
                if(segs.length >= 3){
                    var en2 = segs[0].trim();
                    var phon = segs[1].trim();
                    var zh2 = segs.slice(2).join("，").trim();
                    if(en2 && zh2){
                        wordDb.push({en:en2, phon:phon, zh:zh2, group:gname, level:0, nextReview:0});
                        cnt++;
                    } else { skipped++; if(!sampleSkip) sampleSkip = line; }
                } else { skipped++; if(!sampleSkip) sampleSkip = line; }
            }

            if(i > 0 && i % 300 === 0){
                btn.textContent = "⏳ " + i + "/" + total;
                await new Promise(function(r){ setTimeout(r, 0); });
            }
        }

        btn.textContent = "💾 保存中...";
        saveWords(); saveSentences();
        await new Promise(function(r){ setTimeout(r, 50); });

        btn.disabled = false;
        btn.textContent = oldLabel;

        if(cnt > 0){
            renderGroup(gname);
            switchMode(appMode);
            var msg = "✅ 导入 " + cnt + " 条";
            if(skipped > 0) msg += "\n跳过 " + skipped + " 条（格式不符）";
            showToast(msg, skipped > 0 ? "warn" : "success");
        } else {
            var tip = "❌ 未导入任何内容";
            if(sampleSkip) tip += "\n问题行示例：\n" + sampleSkip.slice(0, 40);
            showToast(tip, "error");
        }
    };

    $("resetLevelBtn").onclick=function(){
        if(confirm("重置当前分组关卡到第1关？")){
            setCurrentLevel(1);
        }
    };
    $("resetAllBtn").onclick=function(){
        if(!confirm("⚠️重置全部？"))return;
        wordDb=buildAllDefaultWords();
        sentenceDb=buildAllDefaultSentences();
        errorWordSet={};
        groupLevels = {};
        groupReviewPages = {};
        saveGroupLevels();
        saveGroupReviewPages();
        saveWords();saveSentences();saveErrors();
        renderGroup();
        switchMode(appMode);
    };
    $("delGroupAllBtn").onclick=function(){
        var g=getCurrentGroup();
        if(!confirm("⚠️删除分组【"+g+"】？"))return;
        wordDb=wordDb.filter(function(w){return (w.group||"核心词汇")!==g;});
        sentenceDb=sentenceDb.filter(function(s){return (s.group||"句子库")!==g;});
        delete groupLevels[g];
        delete groupReviewPages[g];
        saveGroupLevels();
        saveGroupReviewPages();
        saveWords();saveSentences();renderGroup();
        switchMode(appMode);
    };
}

/* ============================================================
 * 初始化
 * ============================================================ */
async function init(){
    await loadAll();
    renderGroup();
    bindButtons();
    bindReviewSwipe();
    appMode="normal"; modeIndex=0;
    updateUiVisible(); buildGame();
    updateDueCount(); updateLevelUi(); updateModeStatText();
}
if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded", function(){ init(); });
} else {
    init();
}
</script>
